services:
  portfolio:
    image: ghcr.io/codekheb/portfoliossh:${PORTFOLIO_TAG}
    container_name: portfolio-ssh
    restart: unless-stopped
    ports:
      - "22:42069"
      - "42069:42069"
    environment:
      SSH_ADDRESS: ":42069"
      SSH_HOST_KEY: "/keys/host_key"
      WEB_ADDRESS: ":8081"
      DATABASE_PATH: "/data/messages.db"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ./.docker-data/host_key:/keys/host_key:ro
      - portfolio-data:/data
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.getclingy.download"
      GF_SERVER_DOMAIN: "grafana.getclingy.download"
      GF_SERVER_PROTOCOL: "http"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: ghcr.io/codekheb/portfolio-nginx:${NGINX_TAG}
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - portfolio
      - grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  portfolio-data:
