services:
  portfolio:
    image: ghcr.io/codekheb/portfoliossh:${IMAGE_TAG}
    container_name: portfolio-ssh
    restart: unless-stopped
    ports:
      - "42069:42069"
    environment:
      SSH_ADDRESS: ":42069"
      SSH_HOST_KEY: "/data/host_key"
    volumes:
      - ./.docker-data/host_key:/data/host_key:ro
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "http://${PUBLIC_IP}/"
      GF_SERVER_DOMAIN: "${PUBLIC_IP}"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
