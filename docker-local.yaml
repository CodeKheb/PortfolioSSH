services:
  portfolio:
    build: .
    container_name: portfolio-ssh
    restart: unless-stopped
    ports:
      - "42069:42069"
      - "8080:8080"
    environment:
      SSH_ADDRESS: ":42069"
      SSH_HOST_KEY: "/data/host_key"
    volumes:
      - ./.docker-data/host_key:/data/host_key:ro
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

volumes:
  prometheus-data:
  grafana-data:
