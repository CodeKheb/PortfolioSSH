services:
  portfolio:
    build: .
    container_name: portfolio-ssh
    restart: unless-stopped
    ports:
      - "42069:42069"
      - "8080:8080"
    environment:
      SSH_ADDRESS: ":42069"
      SSH_HOST_KEY: "/data/host_key"
    volumes:
      - ./.docker-data/host_key:/data/host_key:ro
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
