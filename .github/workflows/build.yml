name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
      
          docker build \
            -t "$IMAGE" \
            .
      
      - name: Push image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
      
          docker push "$IMAGE"

      - name: Configure SSH
        run: |
          mkdir ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy 
        run: |
          ssh \
           -i ~/.ssh/deploy_key \
           "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
           "cd ~/PortfolioSSH && IMAGE_TAG=${GITHUB_SHA} docker compose pull && \
            IMAGE_TAG=${GITHUB_SHA} docker compose up -d"
